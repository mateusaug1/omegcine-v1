<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quem está Assistindo??</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Archivo Black', sans-serif;
            background-color: #0a0a0a;
            color: white;
            margin: 0;
            overflow: hidden;
        }
    
        .body-two {
            font-family: 'Nunito', sans-serif;
            background-color: #0a0a0a;
            color: white;
            margin: 0;
            overflow: hidden;
        }

        .profile-image-container {
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* Efeito de esticar ao segurar */
        .profile-card.active .profile-image-container {
            transform: scale(1.3);
        }

        .profile-card:hover .profile-image-container {
            border: 4px solid white;
        }

        .profile-card:hover span {
            color: white;
        }

        .animate-fade-in {
            animation: fadeIn 0.8s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center select-none">

    <!-- Fundo com Gradiente -->
    <div class="fixed inset-0 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-zinc-800/20 via-black to-black -z-10"></div>

    <!-- Logo -->
    <header class="absolute top-0 left-0 w-full p-8 flex justify-center md:justify-start">
        <img src="omegcine_icon.png" alt="Omegcine" class="h-8 md:h-10">
    </header>

    <!-- Conteúdo Central -->
    <main class="text-center animate-fade-in px-4">
        <h1 class="text-4xl md:text-6xl font-bold mb-12 md:mb-20 tracking-tight typewriter"
    data-text="Quem está assistindo?">
</h1>

        <div id="profiles-grid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-8 md:gap-12 max-w-7xl mx-auto">
            <!-- Os perfis serão gerados via JavaScript -->
        </div>
    </main>

    <script>
    const profiles = [
        { id: 1, nome: 'Mateus', link_photo: 'mateus_icon.png' },
        { id: 2, nome: 'Augusto', link_photo: 'augusto_icon.jpg' },
        { id: 3, nome: 'Widson', link_photo: 'widson_icon.png' },
        { id: 4, nome: 'Malison', link_photo: 'nop.png' },
        { id: 5, nome: 'Igor', link_photo: 'nop.png' },
        { id: 6, nome: 'Gabriel', link_photo: 'gabriel_icon.png' }
    ];

    const grid = document.getElementById('profiles-grid');

    profiles.forEach(profile => {
        const card = document.createElement('div');
        card.className = 'profile-card group flex flex-col items-center cursor-pointer';

        card.innerHTML = `
            <div class="profile-image-container relative w-28 h-28 sm:w-36 lg:w-40 sm:h-36 lg:h-40 rounded-full border-4 border-transparent overflow-hidden shadow-2xl">
                <img src="${profile.link_photo}" alt="${profile.nome}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500">
            </div>

            <span class="body-two mt-6 text-lg md:text-xl font-black uppercase tracking-widest text-zinc-400 transition-colors duration-300 typewriter"
                  data-text="${profile.nome}">
            </span>
        `;

        // efeito active (segurar)
        const startEffect = () => card.classList.add('active');
        const endEffect = () => card.classList.remove('active');

        card.addEventListener('mousedown', startEffect);
        card.addEventListener('mouseup', endEffect);
        card.addEventListener('mouseleave', endEffect);

        card.addEventListener('touchstart', (e) => {
            e.preventDefault();
            startEffect();
        }, { passive: false });

        card.addEventListener('touchend', endEffect);

        grid.appendChild(card);
    });

    // ===== TYPEWRITER =====
    function digitar(el, texto, velocidade = 80) {
        let i = 0;
        el.textContent = "";

        const timer = setInterval(() => {
            el.textContent += texto[i];
            i++;

            if (i >= texto.length) clearInterval(timer);
        }, velocidade);
    }

    document.querySelectorAll(".typewriter").forEach((el, index) => {
        const texto = el.getAttribute("data-text");

        setTimeout(() => {
            digitar(el, texto, 90);
        }, index * 300);
    });
</script>
</body>
</html>
